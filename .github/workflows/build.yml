name: Build Eldia Worlds Plugins

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  python-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build & test tools
        run: |
          python -m pip install --upgrade pip build pytest ruff endstone
          pip install -e . --no-deps
      - name: Lint and test
        run: |
          ruff check src tests
          pytest -v
      - name: Build Python wheel
        run: |
          python -m build --wheel --outdir dist-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: eldia-worlds-python-wheel
          path: dist-artifacts/*.whl

  native-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Clang 18
        env:
          LLVM_VERSION: 18
        run: |
          sudo apt-get update -y -q
          sudo apt-get install -y -q lsb-release wget software-properties-common gnupg
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${LLVM_VERSION}
          sudo apt-get install -y -q libc++-${LLVM_VERSION}-dev libc++abi-${LLVM_VERSION}-dev
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-${LLVM_VERSION} 200
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-${LLVM_VERSION} 200
      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@latest
      - name: Configure and build (.so)
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S native -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-linux
      - name: Collect .so artifact
        run: |
          mkdir -p dist-native-linux
          find build-linux -maxdepth 2 -name "*.so" -exec cp -v {} dist-native-linux/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: eldia-worlds-native-linux-so
          path: dist-native-linux/*.so

  native-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure and build (.dll)
        shell: cmd
        run: |
          cmake -S native -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-win
      - name: Collect .dll artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-native-win | Out-Null
          Get-ChildItem -Path build-win -Filter *.dll -Recurse | Copy-Item -Destination dist-native-win
      - uses: actions/upload-artifact@v4
        with:
          name: eldia-worlds-native-windows-dll
          path: dist-native-win/*.dll

  release:
    needs: [python-wheel, native-linux, native-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*.whl
            release-assets/*.so
            release-assets/*.dll
