[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-eldia-worlds"
version = "0.2.6"
description = "Virtual multi-world and dimension manager plugin and API package for Endstone"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["endstone>=0.11"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.entry-points."endstone"]
eldia_worlds = "eldia_worlds:WorldsPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/eldia_worlds"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
